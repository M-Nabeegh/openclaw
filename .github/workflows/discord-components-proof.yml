name: Discord components proof

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "OpenClaw commit to test"
        required: true
        default: "ca4e424dd6a27356ea6656d015ea58f0170a2a89"

permissions:
  contents: read

jobs:
  discord-components:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out requested OpenClaw head
        uses: actions/checkout@v4
        with:
          repository: openclaw/openclaw
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Set up Node and dependencies
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.15.0"
          install-bun: "false"

      - name: Run Discord component regression and loopback proof
        shell: bash
        run: |
          set -o errexit -o nounset -o pipefail
          proof_log="$RUNNER_TEMP/discord-components-proof.log"
          node --import tsx scripts/run-vitest.mjs run \
            --config test/vitest/vitest.extension-discord.config.ts \
            extensions/discord/src/components-param.test.ts \
            extensions/discord/src/channel-actions.test.ts \
            extensions/discord/src/actions/handle-action.test.ts \
            extensions/discord/src/actions/runtime.test.ts \
            --reporter=verbose 2>&1 | tee "$proof_log"
          {
            echo "## Discord component proof"
            echo
            echo "Tested commit: \\`$(git rev-parse HEAD)\\`"
            echo
            echo '```text'
            rg '\\[discord components mock-rest proof\\]' "$proof_log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
